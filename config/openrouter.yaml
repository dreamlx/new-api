# OpenRouter Models API 配置文件
#
# 此配置文件用于扩展模型的元数据信息，使其符合 OpenRouter 格式
# 配置路径可通过环境变量 OPENROUTER_CONFIG_PATH 覆盖

# 全局配置
enabled: true        # 是否启用 OpenRouter API
cache_ttl: 300       # 缓存过期时间（秒），默认5分钟

# 默认值配置（未在 models 中定义的模型使用这些默认值）
fallback:
  use_defaults: true
  default_context_length: 8192
  default_pricing:
    prompt: "0.00001"
    completion: "0.00002"
    request: "0"
    image: "0"
    web_search: "0"
    internal_reasoning: "0"
  default_architecture:
    modality: "text->text"
    input_modalities: ["text"]
    output_modalities: ["text"]
    tokenizer: "Unknown"
    instruct_type: null

